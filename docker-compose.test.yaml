# Override used only by test/run-integration.js to register a dedicated,
# non-secret OIDC client for the headless integration tests.
services:
  cidm-stub:
    environment:
      MONGO_BACKEND: mongodb
      OIDC_CLIENTS: ${OIDC_CLIENTS}
      ADMIN_API_KEY: ${ADMIN_API_KEY:-integration-test-admin-key}
