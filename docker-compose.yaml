services:
  db:
    image: mongo:8
    container_name: cidm-stub-db
    environment:
      MONGO_INITDB_DATABASE: cidm-stub
      # dev-only fixed credentials, not a secret
      MONGO_INITDB_ROOT_USERNAME: mongoadmin
      MONGO_INITDB_ROOT_PASSWORD: secret
    expose:
      - "27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "-u", "mongoadmin", "-p", "secret", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    # published so the host-side seed script can reach it; the app itself still uses the internal docker DNS name
    ports:
      - "27017:27017"
    volumes:
      - cidm-stub-db-data:/data/db

  cidm-stub:
    build:
      context: .
      target: development
      args:
        PARENT_VERSION: ${PARENT_VERSION:-3.1.4-node24.19.0}
        PORT: ${PORT:-3000}
    image: cidm-stub
    container_name: cidm-stub
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      SEED_FILE_PATH: /app/data/accounts.development.json
    command: npm run dev
    volumes:
      - ./src:/home/node/src
      - ./public:/home/node/public
      - ./data/accounts.development.json:/app/data/accounts.development.json:ro
    ports:
      - "${PORT:-3000}:${PORT:-3000}"

volumes:
  cidm-stub-db-data:
